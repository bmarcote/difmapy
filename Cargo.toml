[workspace]
members = ["crates/difmap-core", "crates/difmap-py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# See NOTICE.md: the licence is unsettled until the Difmap copyright
# holder has been consulted, so nothing is published to crates.io.
publish = false
