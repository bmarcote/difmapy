name: build wheels

# Builds portable wheels for the platforms users actually have, plus an
# sdist, and (on a tag) uploads them to PyPI.
#
# Wheels are abi3 (built against the stable Python ABI), so ONE wheel per
# platform covers Python 3.11 and every later version - there is no need
# for a matrix over Python versions.
#
# Linux wheels are built inside a manylinux2014 container so they run on
# glibc >= 2.17 (RHEL/Rocky 7+, Ubuntu 16.04+). Building on the host
# instead would tag the wheel with the host's glibc (e.g.
# manylinux_2_35), which would exclude older clusters.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-14
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # Smoke-test a built wheel on a clean machine before releasing.
  test-wheel:
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install dist/*.whl pytest
          python -c "import difmapy; print(difmapy.__version__)"
          # The real-data tests skip automatically when the data are absent.
          pytest tests -q

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, sdist, test-wheel]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
