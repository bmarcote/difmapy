[package]
name = "difmap-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
difmap-core = { path = "../difmap-core" }
num-complex = "0.4.6"
numpy = "0.29.0"
pyo3 = { version = "0.29.1", features = ["extension-module", "abi3-py311"] }
